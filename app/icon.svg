<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Rounded square base -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Top-half shine for depth -->
  <rect width="32" height="32" rx="7" fill="url(#shine)"/>

  <!-- Crisp inner border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25"
        stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- Geometric L mark — pulled inward so round caps stay inside the box -->
  <path d="M10.5 9.5 L10.5 22.5 L21.5 22.5"
        stroke="white" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent dot — echoes the period in Lokesh.dev -->
  <circle cx="25.5" cy="22.5" r="2.2" fill="white" opacity="0.9"/>
</svg>
